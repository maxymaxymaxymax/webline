<!doctype html><html><body style="margin:0"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const names=['hero','Soldier','Michelle','thug_bearded','thug_biker','civ_guard','civ_man','civ_woman','civ_coat','civ_worker'];
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(1600,600); document.body.appendChild(r.domElement); r.outputEncoding=THREE.sRGBEncoding;
const s=new THREE.Scene(); s.background=new THREE.Color(0x888888); s.add(new THREE.HemisphereLight(0xffffff,0x444444,1.5)); const dl=new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(1,2,3); s.add(dl);

 const lh=sk.skeleton.bones.find(b=>/LeftHand$|LeftHand_\d+$/.test(b.name)); const lhp=new THREE.Vector3(); if(lh) lh.getWorldPosition(lhp);

 const sc=1.8/sz.y; o.scale.multiplyScalar(sc); o.position.set(i*2-b.min.x*0, -b.min.y*sc,0); s.add(o);

}
r.render(s,cam); window.RESULT=out; document.title='done';
</script></body></html>
